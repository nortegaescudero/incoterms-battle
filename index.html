<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico Battle</title>
<link rel="stylesheet" href="css/estilo.css?v=22">
</head>
<body>

<div id="pEntrar" class="pantalla">
  <div class="caja estrecha">
    <img src="img/titulo.png?v=22" alt="Nico Battle" class="titulo-juego">
    <p class="sub">Escribe el código que ves en la pantalla del profesor</p>
    <div class="paso">
      <label class="campo">Código de la partida<input id="codigo" maxlength="6" autocomplete="off" spellcheck="false" class="codigo"></label>
      <label class="campo">Tu nombre<input id="nombre" maxlength="16" autocomplete="off"></label>
      <button class="boton verde ancho" id="botonEntrar">Entrar</button>
      <div id="errorEntrar" class="error"></div>
    </div>
    <p class="pie"><a href="practica.html">Modo práctica (sin partida)</a></p>
    <div class="firma"><img src="img/logo_nico.png?v=22" alt="Logo de Nico">Un juego de Nico Games</div>
  </div>
</div>

<div id="pPersonaje" class="pantalla oculto">
  <div class="caja">
    <h1>Elige tu personaje</h1>
    <p class="sub">Puedes repetir personaje con un compañero</p>
    <div class="personajes" id="personajes"></div>
    <button class="boton verde" id="botonListo" disabled>¡Listo!</button>
  </div>
</div>

<div id="pEspera" class="pantalla oculto">
  <div class="caja">
    <h1>¡Ya estás dentro, <span id="esperaNombre"></span>!</h1>
    <p class="sub">Espera a que el profesor pulse «Comenzar»</p>
    <div class="paso">
      <h2>En la sala (<span id="esperaCuantos">0</span>)</h2>
      <div class="lista-sala" id="esperaLista"></div>
    </div>
    <button class="boton gris" id="botonCambiarPj">Cambiar de personaje</button>
  </div>
</div>

<div id="pFinal" class="pantalla oculto"><div class="final" id="finalCont"></div></div>

<div id="pMensaje" class="pantalla oculto">
  <div class="caja estrecha">
    <h1 id="mensajeTitulo"></h1>
    <p class="sub" id="mensajeTexto"></p>
    <button class="boton" id="botonVolver">Volver al inicio</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config_firebase.js?v=22"></script>
<script src="img/sprites_datos.js?v=22"></script>
<script src="js/ciudad.js?v=22"></script>
<script src="js/mapa.js?v=22"></script>
<script src="js/sprites.js?v=22"></script>
<script src="js/comun.js?v=22"></script>
<script src="js/sonido.js?v=22"></script>
<script src="js/peligros.js?v=22"></script>
  <script src="js/motor.js?v=22"></script>
<script src="js/red.js?v=22"></script>
<script src="js/final.js?v=22"></script>
<script src="js/alumno.js?v=22"></script>
</body>
</html>
