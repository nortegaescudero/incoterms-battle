<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nico Battle · Práctica</title>
<link rel="stylesheet" href="css/estilo.css?v=22">
</head>
<body>

<div id="menu" class="pantalla">
  <div class="caja">
    <img src="img/titulo.png?v=22" alt="Nico Battle" class="titulo-juego">
    <p class="sub">Modo práctica: un jugador en este ordenador contra muñecos de prueba</p>
    <div class="paso">
      <h2><span>1</span>Carga el Excel de preguntas</h2>
      <input type="file" id="archivo" accept=".xlsx,.xls" class="oculto">
      <button class="boton" id="botonExcel">Elegir Excel…</button>
      <div id="resumenExcel" class="resumen"></div>
    </div>
    <div class="paso">
      <h2><span>2</span>Elige mapa y personaje</h2>
      <label class="campo en-linea ancho-sel">Mapa<select id="selMapa"></select></label>
      <div class="personajes" id="personajes"></div>
    </div>
    <button class="boton verde" id="botonJugar" disabled>¡Jugar!</button>
    <div class="firma"><img src="img/logo_nico.png?v=22" alt="Logo de Nico">Un juego de Nico Games</div>
  </div>
</div>

<script src="img/sprites_datos.js?v=22"></script>
<script src="js/excel.js?v=22"></script>
<script src="js/ciudad.js?v=22"></script>
<script src="js/mapa.js?v=22"></script>
<script src="js/sprites.js?v=22"></script>
<script src="js/comun.js?v=22"></script>
<script src="js/sonido.js?v=22"></script>
<script src="js/correccion.js?v=22"></script>
<script src="js/peligros.js?v=22"></script>
  <script src="js/motor.js?v=22"></script>
<script src="js/practica.js?v=22"></script>
</body>
</html>
