<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incoterms Battle · Práctica</title>
<link rel="stylesheet" href="css/estilo.css?v=9">
</head>
<body>

<div id="menu" class="pantalla">
  <div class="caja">
    <h1>Incoterms Battle</h1>
    <p class="sub">Modo práctica: un jugador en este ordenador contra muñecos de prueba</p>
    <div class="paso">
      <h2><span>1</span>Carga el Excel de preguntas</h2>
      <input type="file" id="archivo" accept=".xlsx,.xls" class="oculto">
      <button class="boton" id="botonExcel">Elegir Excel…</button>
      <div id="resumenExcel" class="resumen"></div>
    </div>
    <div class="paso">
      <h2><span>2</span>Elige personaje</h2>
      <div class="personajes" id="personajes"></div>
    </div>
    <button class="boton verde" id="botonJugar" disabled>¡Jugar!</button>
  </div>
</div>

<script src="img/sprites_datos.js?v=9"></script>
<script src="js/excel.js?v=9"></script>
<script src="js/mapa.js?v=9"></script>
<script src="js/sprites.js?v=9"></script>
<script src="js/comun.js?v=9"></script>
<script src="js/sonido.js?v=9"></script>
<script src="js/correccion.js?v=9"></script>
<script src="js/motor.js?v=9"></script>
<script src="js/practica.js?v=9"></script>
</body>
</html>
